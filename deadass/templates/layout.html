  <!-- <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> -->

      display: inline-block;
      padding: 0.18em 0.5em;
      background-color: rgba(0, 0, 0, 0.08);

        <!--<form method="get" action="https://github.com/jabbate19/LightTable"><button class="btn btn-secondary my-2 my-sm-0" type="submit">-->

<div id="content" class="container">
  {% block content %}
  <!--Template extended content here.-->

</div>
<footer class="py-10 bg-light">
  <div class="container">
    <p class="m-0 text-center text-black"><a class="text-black" href="https://github.com/ComputerScienceHouse/deadass2">Deadass2
      ({{commit}})</a></p>
  </div>
</footer>
<script>
  (function () {
    function flashCopied(btn) {
      var label = btn.querySelector('.deadass-copy-label');
      var original = label ? label.textContent : null;
      btn.classList.add('is-copied');
      if (label) { label.textContent = 'Copied'; }
      setTimeout(function () {
        btn.classList.remove('is-copied');
        if (label && original !== null) { label.textContent = original; }
      }, 1500);
    }

    function fallbackCopy(text, btn) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) {
        flashCopied(btn);
      } else {
        window.prompt('Copy this credential:', text);
      }
    }

    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.deadass-copy');
      if (!btn) { return; }
      e.preventDefault();
      var text = btn.getAttribute('data-deadass-copy');
      if (text === null) { return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { flashCopied(btn); },
          function () { fallbackCopy(text, btn); }
        );
      } else {
        fallbackCopy(text, btn);
      }
    });
  })();
</script>
</body>

</html>
